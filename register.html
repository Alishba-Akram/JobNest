
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account | JobNest</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:Arial;background:#f1f5fb;color:#102c50;min-height:100vh;padding:35px 15px}.register{max-width:560px;margin:auto;background:white;border:1px solid #e5eaf2;border-radius:15px;padding:35px;box-shadow:0 12px 35px #102c5010}.logo{text-align:center;font-size:28px;font-weight:800}.logo span{color:#2563eb}.intro{text-align:center;color:#718096;font-size:13px;margin:8px 0 27px}.register h1{text-align:center;font-size:25px;margin-bottom:8px}.field{margin:15px 0}.field label{display:block;font-size:13px;font-weight:bold;margin-bottom:7px}.field input,.field select{width:100%;padding:13px;border:1px solid #dce4ef;border-radius:7px;font-size:14px;outline-color:#2563eb}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.btn{width:100%;padding:14px;background:#2563eb;color:white;border:0;border-radius:7px;font-weight:bold;cursor:pointer;margin-top:12px}.terms{font-size:12px;color:#718096;margin:15px 0}.terms a,.bottom a{color:#2563eb;font-weight:bold}.bottom{text-align:center;font-size:13px;color:#718096;margin-top:20px}.back{text-align:center;margin-top:18px;font-size:13px}.back a{color:#2563eb}
@media(max-width:500px){.grid{grid-template-columns:1fr}.register{padding:25px 20px}}
</style>
</head>
<body>
<main class="register">
<div class="logo">JOB<span>NEST.</span></div>
<p class="intro">Create your account and discover new opportunities.</p>
<h1>Join JobNest Today</h1>
<form onsubmit="event.preventDefault();alert('Demo registration complete! Real account creation needs backend integration.');">
<div class="field"><label>I want to join as</label><select required><option value="">Select account type</option><option>Job Seeker</option><option>Employer</option></select></div>
<div class="grid">
<div class="field"><label>First Name</label><input required placeholder="First name"></div>
<div class="field"><label>Last Name</label><input required placeholder="Last name"></div>
</div>
<div class="field"><label>Email Address</label><input type="email" required placeholder="you@example.com"></div>
<div class="field"><label>Phone Number</label><input type="tel" placeholder="+92 300 0000000"></div>
<div class="field"><label>Password</label><input type="password" minlength="8" required placeholder="At least 8 characters"></div>
<div class="field"><label>Confirm Password</label><input type="password" minlength="8" required placeholder="Re-enter password"></div>
<label class="terms"><input type="checkbox" required> I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>.</label>
<button class="btn">Create My Account →</button>
</form>
<p class="bottom">Already have an account? <a href="login.html">Sign In</a></p>
<p class="back"><a href="index.html">← Back to Homepage</a></p>
</main>
</body>
</html>
