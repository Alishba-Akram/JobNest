
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | JobNest</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:Arial;background:#f1f5fb;color:#102c50;min-height:100vh;display:grid;place-items:center;padding:25px}.login{width:100%;max-width:440px;background:white;border:1px solid #e5eaf2;border-radius:16px;padding:38px;box-shadow:0 15px 45px #102c5010}.logo{display:block;text-align:center;font-size:29px;font-weight:800;margin-bottom:8px}.logo span{color:#2563eb}.sub{text-align:center;color:#718096;font-size:14px;margin-bottom:28px}.login h1{text-align:center;font-size:25px;margin-bottom:8px}.field{margin:18px 0}.field label{display:block;font-size:13px;font-weight:bold;margin-bottom:8px}.field input,.field select{width:100%;padding:14px;border:1px solid #dce4ef;border-radius:8px;font-size:14px;outline-color:#2563eb}.row{display:flex;justify-content:space-between;gap:10px;font-size:12px;color:#718096}.row a,.bottom a{color:#2563eb;font-weight:bold}.btn{width:100%;padding:14px;background:#2563eb;color:white;border:0;border-radius:8px;font-weight:bold;font-size:14px;cursor:pointer;margin-top:20px}.bottom{text-align:center;color:#718096;font-size:13px;margin-top:22px}.back{text-align:center;margin-top:22px;font-size:13px;color:#718096}.back a{color:#2563eb;font-weight:bold}
</style>
</head>
<body>
<main class="login">
<a class="logo" href="index.html">JOB<span>NEST.</span></a>
<p class="sub">Your career journey starts here.</p>
<h1>Welcome Back!</h1>
<p class="sub">Sign in to continue to your account.</p>
<form onsubmit="event.preventDefault();alert('Demo login only. Authentication requires a backend.');">
<div class="field"><label>Email Address</label><input type="email" required placeholder="Enter your email"></div>
<div class="field"><label>Password</label><input type="password" required placeholder="Enter your password"></div>
<div class="row"><label><input type="checkbox"> Remember me</label><a href="#" onclick="alert('Connect a password reset page to use this feature.')">Forgot Password?</a></div>
<div class="field"><label>Login As</label><select><option>Job Seeker</option><option>Employer</option></select></div>
<button class="btn">Sign In →</button>
</form>
<p class="bottom">Don't have an account? <a href="register.html">Create Account</a></p>
<p class="back"><a href="index.html">← Back to Homepage</a></p>
</main>
</body>
</html>
